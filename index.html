<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detectives de datos · Estadística (10mo EGB)</title>
<style>
:root{--bg:#f6f3ea;--fg:#23251d;--card:#ffffff;--accent:#1d6f8f;--grain:#d9961b;--ok:#2f8f46;--bad:#c2452d;--mut:#6f6c5d;--line:#ddd6bf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d17;--fg:#ece9dc;--card:#262a21;--accent:#6ec3e0;--grain:#f0b645;--ok:#5fcf7c;--bad:#ff8a6f;--mut:#a7a592;--line:#3e4434}}
:root[data-theme="dark"]{--bg:#1a1d17;--fg:#ece9dc;--card:#262a21;--accent:#6ec3e0;--grain:#f0b645;--ok:#5fcf7c;--bad:#ff8a6f;--mut:#a7a592;--line:#3e4434}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:17px/1.45 "Trebuchet MS",Verdana,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:8px 0 6px}
h2{font:700 19px/1.2 Georgia,serif;margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--mut)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--grain);transition:width .4s}
button{font:inherit;cursor:pointer;border:2px solid var(--accent);background:var(--card);color:var(--fg);border-radius:10px;padding:12px 14px;width:100%;text-align:left;margin:6px 0;min-height:48px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--grain);outline-offset:2px}
button.go{background:var(--accent);color:#fff;text-align:center;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.go{color:#10222b}}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
button:disabled{cursor:default}
.opt{font-size:19px}
.fb{margin:10px 0;padding:10px 12px;border-left:6px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:6px}
details{font-size:15px;margin:8px 0}summary{cursor:pointer;color:var(--accent);font-weight:700}
input{font:inherit;width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin:4px 0 8px}
.code{font-family:Consolas,monospace;background:var(--bg);border:2px dashed var(--accent);padding:10px;border-radius:8px;margin:8px 0;word-break:break-word}
.big{font-size:44px;text-align:center;margin:4px 0}
.q{font-size:18px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const SH=a=>a.slice().sort(()=>Math.random()-.5);
const sum=a=>a.reduce((x,y)=>x+y,0);
const fm=n=>String(Math.round(n*10)/10);
const POP=[['Todos los estudiantes del colegio','30 estudiantes elegidos al azar del colegio'],
['Todas las familias de la comunidad','20 familias encuestadas de la comunidad'],
['Todas las plantas de cacao de la finca','40 plantas de cacao medidas en la finca'],
['Todos los sacos de arroz de la cosecha','10 sacos de arroz pesados al azar'],
['Todos los vehículos de la parroquia','50 vehículos revisados en la parroquia'],
['Todos los árboles de plátano de la finca','25 plantas de plátano seleccionadas']];
const QT=['Altura de una planta (cm)','Peso de un saco de arroz (kg)','Edad de un estudiante (años)','Ingreso mensual de una familia ($)','Número de hijos por familia','Litros de leche por día','Número de animales en la finca'];
const QL=['Color de ojos','Estado civil','Tipo de vivienda','Profesión','Variedad de cacao','Medio de transporte a la escuela','Cultivo preferido'];
const DE=['Calcular la media de las calificaciones de un curso','Hacer un gráfico de barras con las profesiones de una encuesta','Hallar la moda de los colores de los vehículos vendidos','Calcular el rango de temperaturas diarias de una ciudad','Crear un histograma con las edades de los empleados'];
const IN=['Estimar la proporción de votantes que apoyan a un candidato a partir de una encuesta','Inferir el ingreso medio de una ciudad usando una muestra','Predecir la demanda futura de un producto con datos históricos','Evaluar si un medicamento nuevo es efectivo con un ensayo clínico','Decidir si dos métodos de enseñanza difieren de forma significativa'];
const AR=[['Evaluar un medicamento para la hipertensión comparando la presión antes y después','Medicina'],['Analizar la incidencia y prevalencia de enfermedades','Medicina'],
['Analizar el PIB y la tasa de desempleo de un país','Economía'],['Estudiar la inflación y las tasas de interés','Economía'],
['Analizar los resultados de las pruebas PISA','Educación'],['Estudiar las tasas de abandono escolar y sus causas','Educación'],
['Segmentar clientes con datos de ventas y encuestas','Marketing'],['Evaluar la efectividad de distintos canales de publicidad','Marketing']];
const CX=[['Los kg de cacao cosechados en 5 días'],['Las notas de 5 estudiantes'],['Los litros de agua medidos en 5 días en la acequia']];
const LV=['Nivel 1 · Población y muestra','Nivel 1 · Población y muestra','Nivel 1 · Población y muestra','Nivel 2 · Tipos de variable','Nivel 2 · Tipos de variable','Nivel 2 · Tipos de variable','Nivel 3 · Descriptiva o inferencial','Nivel 3 · Descriptiva o inferencial','Nivel 4 · Mide los datos','Nivel 4 · Mide los datos','Nivel 5 · Estadística en la vida real','Nivel 5 · Estadística en la vida real'];
let S;
const pick=(a,k)=>{if(!S.u[k]||!S.u[k].length)S.u[k]=SH(a);return S.u[k].pop()};
const gd=c=>{let a;do{a=Array.from({length:5},()=>R(2,9))}while(!c(a));return a};
function gen(i){const q={};
if(i<3){const p=pick(POP,'p'),s=Math.random()<.5;q.txt=`Un estudio menciona: «${p[s?1:0]}». ¿Es una población o una muestra?`;q.o=['Población','Muestra'];q.t=s?'Muestra':'Población';
q.ex=s?`Es solo una parte del conjunto completo («${p[0].toLowerCase()}»), por eso es una muestra.`:`Incluye a todos los elementos del grupo, por eso es la población. Una muestra sería «${p[1].toLowerCase()}».`}
else if(i<6){const c=Math.random()<.5,v=pick(c?QT:QL,c?'vt':'vl');q.txt=`La variable «${v}» es:`;q.o=['Cuantitativa','Cualitativa'];q.t=c?'Cuantitativa':'Cualitativa';q.ex=c?'Se expresa con números: representa una cantidad.':'Se describe con categorías: representa una cualidad.'}
else if(i<8){const d=Math.random()<.5,s=pick(d?DE:IN,d?'d':'n');q.txt=`«${s}». ¿A qué tipo de estadística corresponde?`;q.o=['Descriptiva','Inferencial'];q.t=d?'Descriptiva':'Inferencial';q.ex=d?'Describe y resume los datos que ya se tienen, con medidas o gráficos.':'Generaliza o predice sobre una población a partir de una muestra de datos.'}
else if(i<10){const ty=i==8?'media':pick(['mediana','moda','rango'],'t'),
a=gd(x=>ty=='media'?sum(x)%5==0:ty=='moda'?new Set(x).size==4:true),so=a.slice().sort((x,y)=>x-y),mn=sum(a)/5,
cnt=v=>a.filter(y=>y==v).length,md=so.slice().sort((x,y)=>cnt(y)-cnt(x))[0],rg=so[4]-so[0],me=so[2],
t=ty=='media'?mn:ty=='mediana'?me:ty=='moda'?md:rg,
lab={media:'la media',mediana:'la mediana',moda:'la moda',rango:'el rango'}[ty],T=fm(t);
const d=[...new Set([mn,me,md,rg,t+1,t-1,t+2].map(fm))].filter(x=>x!==T&&+x>0);
q.txt=`${pick(CX,'c')[0]} fueron: ${a.join(', ')}. ¿Cuál es ${lab}?`;q.o=SH([T,...SH(d).slice(0,3)]);q.t=T;
q.ex=ty=='media'?`Suma = ${sum(a)}; ${sum(a)} ÷ 5 = ${T}.`:ty=='mediana'?`Ordenados: ${so.join(', ')}. El valor central es ${T}.`:ty=='moda'?`El valor que más se repite es ${T}.`:`Mayor − menor = ${so[4]} − ${so[0]} = ${T}.`}
else{const p=pick(AR,'a');q.txt=`¿En qué área se aplica la estadística en este caso? «${p[0]}»`;q.o=SH(['Medicina','Economía','Educación','Marketing']);q.t=p[1];q.ex=`Este ejemplo corresponde al área de ${p[1]}.`}
return q}
const app=document.getElementById('app');
function start(){S={i:0,pts:0,ok:0,st:0,u:{}};next()}
function intro(){app.innerHTML=`<h1>Detectives de datos en la finca</h1><p>Recorre 12 estaciones y resuelve los casos de estadística. Cada partida trae preguntas nuevas: puedes repetirla para mejorar tu puntaje.</p>
<div class="card"><details open><summary>Recuerda antes de jugar</summary><p><b>Población:</b> todos los elementos del grupo. <b>Muestra:</b> una parte de ellos.<br><b>Cuantitativa:</b> se expresa con números. <b>Cualitativa:</b> se describe con categorías.<br><b>Descriptiva:</b> resume datos. <b>Inferencial:</b> generaliza a partir de una muestra.<br><b>Media:</b> suma ÷ cantidad · <b>Mediana:</b> valor central (ordenados) · <b>Moda:</b> el más repetido · <b>Rango:</b> mayor − menor.</p></details></div>
<button class="go" id="st">Empezar la ruta</button>`;document.getElementById('st').onclick=start}
function next(){if(S.i>=12)return end();S.q=gen(S.i);S.done=false;draw()}
function draw(){const q=S.q;
app.innerHTML=`<div class="row"><span>${LV[S.i]}</span><span>${S.pts} pts</span></div><div class="bar"><i style="width:${S.i/12*100}%"></i></div>
<div class="card"><h2>Estación ${S.i+1} de 12</h2><p class="q">${q.txt}</p><div id="ops">${q.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div><div id="fb"></div></div>
<details><summary>Ver recordatorio</summary><p>Población = todos · Muestra = una parte · Cuantitativa = número · Cualitativa = categoría · Descriptiva = resume · Inferencial = generaliza · Media = suma ÷ cantidad · Rango = mayor − menor</p></details>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b))}
function ans(b){if(S.done)return;S.done=true;const q=S.q,t=q.o[+b.dataset.k],good=t===q.t;
document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q.t)x.classList.add('ok')});
let msg;
if(good){S.ok++;S.st++;const bonus=S.st>=3?5:0;S.pts+=10+bonus;msg=`¡Correcto! +10${bonus?' y +5 de racha':''}.`}else{b.classList.add('bad');S.st=0;msg='Casi. Repasa y sigue adelante.'}
document.getElementById('fb').innerHTML=`<div class="fb"><b>${msg}</b><br>${q.ex}</div><button class="go" id="nx">${S.i==11?'Ver mi resultado':'Siguiente estación'}</button>`;
document.getElementById('nx').onclick=()=>{S.i++;next()}}
function end(){const st=S.ok>=10?'⭐⭐⭐':S.ok>=7?'⭐⭐':'⭐';
app.innerHTML=`<h1>¡Misión cumplida!</h1><div class="card"><div class="big">${st}</div><p style="text-align:center">${S.ok} de 12 correctas · ${S.pts} puntos</p>
<label for="nm">Tu nombre y apellido:</label><input id="nm" autocomplete="off" maxlength="40"><label for="pl">Tu paralelo:</label><input id="pl" autocomplete="off" maxlength="10"><div class="code" id="cd"></div>
<p>Toma una captura de pantalla de este comprobante y envíala por WhatsApp o Classroom.</p></div><button class="go" id="again">Jugar otra vez (salen preguntas nuevas)</button>`;
const dt=new Date().toLocaleDateString('es-EC');
const up=()=>{document.getElementById('cd').textContent=`Reto Estadística 10mo · ${document.getElementById('nm').value||'(tu nombre)'} · ${document.getElementById('pl').value||'(paralelo)'} · ${S.ok}/12 · ${S.pts} pts · ${dt}`};
document.getElementById('nm').oninput=up;document.getElementById('pl').oninput=up;up();document.getElementById('again').onclick=start}
intro();
</script>
</body>
</html>
